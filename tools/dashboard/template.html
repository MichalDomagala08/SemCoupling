<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SemCoupling Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s7: #6250d6; --s8: #e34948;
  --seq2: #9ec5f4; --seq4: #3987e5; --seq6: #184f95; --div-mid: #f0efec;
  --karolina: #6250d6; --janek: #1baf7a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s7: #9085e9; --s8: #e66767;
    --seq2: #6da7ec; --seq4: #3987e5; --seq6: #86b6ef; --div-mid: #383835;
    --karolina: #9085e9; --janek: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s7: #9085e9; --s8: #e66767;
  --seq2: #6da7ec; --seq4: #3987e5; --seq6: #86b6ef; --div-mid: #383835;
  --karolina: #9085e9; --janek: #199e70;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 28px 16px 8px; max-width: 1240px; margin: 0 auto; }
h1 { font-size: 26px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 19px; margin: 36px 0 6px; font-weight: 650; }
h3 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
p.lead { color: var(--ink-2); margin: 0; max-width: 820px; }
main { max-width: 1240px; margin: 0 auto; padding: 0 16px 80px; }
nav.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 14px 0 0; font-size: 13px; }
nav.toc a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--border); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 28px; font-weight: 600; line-height: 1.1; }
.tile .l { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.tile .d { color: var(--muted); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; align-items: start; }
.grid.one { grid-template-columns: 1fr; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 12px; min-width: 0; }
.card .sub { color: var(--ink-2); font-size: 13px; margin: 0 0 8px; }
.card .finding { font-size: 13px; color: var(--ink-2); margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 8px; }
.card .finding b { color: var(--ink); font-weight: 600; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.grid-line { stroke: var(--grid); stroke-width: 1; }
.axis-line { stroke: var(--axis); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.axis-title { fill: var(--ink-2); font-size: 12px; }
.lbl { fill: var(--ink-2); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin: 4px 0 6px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.legend span.line::before { height: 3px; border-radius: 2px; vertical-align: 2px; }
.tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.14); z-index: 20; display: none; max-width: 360px; line-height: 1.4; }
.tip b { font-weight: 600; }
.tools { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
button, select, input[type=text] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button.on { background: var(--s1); color: #fff; border-color: var(--s1); }
table.tv { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 8px; }
table.tv th, table.tv td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.tv th:first-child, table.tv td:first-child { text-align: left; }
table.tv th { color: var(--ink-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
.tv-wrap { max-height: 320px; overflow: auto; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 10px 0 12px; font-size: 13px; color: var(--ink-2); }
.filters label { display: inline-flex; gap: 6px; align-items: center; }
.frag-list { display: grid; grid-template-columns: 1fr; gap: 2px; max-height: 560px; overflow: auto; }
.frag { display: grid; grid-template-columns: 34px 34px 1fr 54px; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.frag:hover { background: var(--page); }
.frag.sel { outline: 2px solid var(--s1); }
.frag .bar { height: 10px; border-radius: 0 4px 4px 0; background: var(--s1); }
.frag .hero { font-weight: 600; font-size: 11px; padding: 1px 4px; border-radius: 4px; color: #fff; text-align: center; }
.hero-K { background: var(--karolina); } .hero-J { background: var(--janek); }
.story { font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--page); border-radius: 8px; padding: 10px 12px; max-height: 260px; overflow: auto; }
.recall { border-bottom: 1px solid var(--grid); padding: 8px 2px; font-size: 13.5px; }
.recall .m { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.recall .m .mw { font-weight: 600; color: var(--ink); }
.recall .m .mwbar { display: inline-block; width: 60px; height: 7px; background: var(--grid); border-radius: 4px; vertical-align: middle; position: relative; }
.recall .m .mwbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s8); border-radius: 4px; }
.recalls { max-height: 520px; overflow: auto; }
.two { display: grid; grid-template-columns: 1fr 1.2fr; gap: 14px; }
@media (max-width: 800px) { .two { grid-template-columns: 1fr; } }
.timeline { display: grid; grid-template-columns: 3fr 1.2fr 2fr; gap: 6px; font-size: 12.5px; margin: 8px 0; }
.timeline div { background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.timeline b { display: block; font-weight: 600; }
.timeline small { color: var(--ink-2); }
.seq { display: flex; gap: 2px; margin: 6px 0; flex-wrap: wrap; }
.seq i { width: 22px; height: 16px; border-radius: 3px; font: 600 10px/16px system-ui; text-align: center; color: #fff; font-style: normal; }
.muted { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--ink-2); margin-left: 6px; vertical-align: middle; }
.theme { position: absolute; right: 16px; top: 16px; }
.warn { background: var(--page); border-left: 3px solid var(--s4); padding: 8px 12px; font-size: 13px; color: var(--ink-2); border-radius: 0 8px 8px 0; margin: 10px 0; }
.summary { background: var(--surface); border-left: 3px solid var(--s1); padding: 10px 14px; font-size: 14px; color: var(--ink); border-radius: 0 10px 10px 0; margin: 10px 0 14px; max-width: 980px; line-height: 1.5; }
.summary b { font-weight: 650; }
</style>
</head>
<body>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<div class="tip" id="tip"></div>
<header>
  <button class="theme" id="themeBtn" title="Tryb jasny/ciemny">◐</button>
  <h1>SemCoupling · Strategic Mind Wandering</h1>
  <p class="lead">Dane behawioralne i okulograficzne eksperymentu BrainHack Kraków 2026 (Domagała, UJ). 58 osób słuchało 40 fragmentów bajki o Karolinie i Janku; po każdym fragmencie sonda „jak bardzo odpłynąłeś” (MW, 0–99) i 25 s ustnej relacji myśli.</p>
  <nav class="toc" id="toc"></nav>
  <div class="tiles" id="tiles"></div>
</header>
<main id="main"></main>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const EYE = D.eye || null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (x, d = 1) => (x == null || Number.isNaN(x)) ? '–' : (+x).toFixed(d);
const pct = x => x == null ? '–' : (100 * x).toFixed(0) + '%';
const pval = p => p == null ? '' : (p < 0.001 ? 'p < 0.001' : 'p = ' + p.toFixed(3));
const EXP = { Exp1_Cued: { name: 'Exp1 · wskazany bohater', c: '--s1' }, Exp2_Preference: { name: 'Exp2 · ocena ciekawości', c: '--s2' } };
const heroC = h => h === 'KAROLINA' ? '--karolina' : '--janek';

// ---------- tooltip
const tip = document.getElementById('tip');
function showTip(html, ev) { tip.innerHTML = html; tip.style.display = 'block'; moveTip(ev); }
function moveTip(ev) { const w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + 14, y = ev.clientY + 14; if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + h > innerHeight - 8) y = ev.clientY - h - 14; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
function hideTip() { tip.style.display = 'none'; }

// ---------- chart scaffolding
function frame(sel, W, H, m) {
  const svg = d3.select(sel).append('svg').attr('viewBox', `0 0 ${W} ${H}`);
  const g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  return { svg, g, w: W - m.l - m.r, h: H - m.t - m.b };
}
function yGrid(g, y, w, ticks = 5) {
  g.append('g').selectAll('line').data(y.ticks(ticks)).join('line').attr('class', 'grid-line').attr('x1', 0).attr('x2', w).attr('y1', d => y(d)).attr('y2', d => y(d));
  g.append('g').selectAll('text').data(y.ticks(ticks)).join('text').attr('class', 'tick').attr('x', -8).attr('y', d => y(d) + 4).attr('text-anchor', 'end').text(d => d);
}
function xAxis(g, x, h, ticks, fmtf = d => d) {
  g.append('line').attr('class', 'axis-line').attr('x1', 0).attr('x2', x.range()[1]).attr('y1', h).attr('y2', h);
  g.append('g').selectAll('text').data(ticks).join('text').attr('class', 'tick').attr('x', d => x(d)).attr('y', h + 16).attr('text-anchor', 'middle').text(fmtf);
}
function axisTitle(g, txt, w, h, axis) {
  if (axis === 'x') g.append('text').attr('class', 'axis-title').attr('x', w / 2).attr('y', h + 34).attr('text-anchor', 'middle').text(txt);
  else g.append('text').attr('class', 'axis-title').attr('transform', `translate(-36,${h / 2}) rotate(-90)`).attr('text-anchor', 'middle').text(txt);
}
function card(parent, title, sub, { wide = false } = {}) {
  const c = d3.select(parent).append('div').attr('class', 'card').style('grid-column', wide ? '1 / -1' : null);
  c.append('h3').text(title);
  if (sub) c.append('p').attr('class', 'sub').html(sub);
  return c;
}
function legend(c, items) {
  const l = c.append('div').attr('class', 'legend');
  items.forEach(it => l.append('span').attr('class', it.line ? 'line' : null).style('--c', css(it.c)).text(it.t));
}
function finding(c, html) { c.append('div').attr('class', 'finding').html(html); }
// table-view twin: button toggles a table built from rows [{col: val}]
function tableView(c, rows, cols) {
  const tools = c.append('div').attr('class', 'tools');
  const wrap = c.append('div').attr('class', 'tv-wrap').style('display', 'none');
  const btn = tools.append('button').text('Tabela').on('click', () => { const on = wrap.style('display') === 'none'; wrap.style('display', on ? 'block' : 'none'); btn.classed('on', on); });
  const t = wrap.append('table').attr('class', 'tv');
  t.append('thead').append('tr').selectAll('th').data(cols).join('th').text(d => d.label);
  t.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => cols.map(cl => cl.f ? cl.f(r[cl.key], r) : r[cl.key])).join('td').text(d => d == null ? '–' : d);
}
function hover(selection, html) {
  selection.on('mouseenter', (ev, d) => showTip(html(d), ev)).on('mousemove', moveTip).on('mouseleave', hideTip);
}

// ---------- sections
const main = d3.select('#main');
const sections = [];
function section(id, title, lead, wniosek) {
  sections.push({ id, title });
  const s = main.append('section').attr('id', id);
  s.append('h2').text(title);
  if (lead) s.append('p').attr('class', 'lead').html(lead);
  if (wniosek) s.append('div').attr('class', 'summary').html('<b>Wniosek.</b> ' + wniosek);
  return s.append('div').attr('class', 'grid').node();
}

// ===== tiles
{
  const t = d3.select('#tiles');
  const m = D.meta;
  const tiles = [
    [m.n_subjects, 'uczestników', '29 + 29 w dwóch eksperymentach'],
    [m.n_trials, 'fragmentów bajki', '~45 s każdy, 20 Karolina + 20 Janek'],
    [m.n_recalls.toLocaleString('pl'), 'relacji myśli', `${m.exp.Exp1_Cued.recalls} w Exp1, ${m.exp.Exp2_Preference.recalls} w Exp2`],
    [fmt(m.exp.Exp1_Cued.mean_mw, 0) + ' / ' + fmt(m.exp.Exp2_Preference.mean_mw, 0), 'średnie MW (0–99)', 'Exp1 / Exp2'],
  ];
  if (EYE) tiles.push([EYE.n_trials.toLocaleString('pl'), 'triali z danymi źrenicy', `${EYE.n_subjects} osób, 100 Hz`]);
  tiles.forEach(([v, l, d]) => { const e = t.append('div').attr('class', 'tile'); e.append('div').attr('class', 'v').text(v); e.append('div').attr('class', 'l').text(l); e.append('div').attr('class', 'd').text(d); });
}

// ===== 1. experiment
{
  const grid = section('exp', '1 · Jak wyglądał eksperyment', 'Jedna sesja to 40 triali w stałej kolejności. Fragmenty obu bohaterów przeplatają się: KAROLINA_1, JANEK_1, KAROLINA_2 … Wszystko przy krzyżu fiksacyjnym, EyeLink 1000 (500 Hz, w danych 100 Hz).',
    'Etykieta stanu jest rzadka: jedna liczba i jedna wypowiedź na ~45 s, a sygnał z oka jest ciągły. Cały problem hackathonu to przerzucić most między tą rzadką etykietą a ciągłym sygnałem, i te dane dają do tego dwa „uchwyty”: instrukcję (Exp1) i ocenę ciekawości (Exp2).');
  const c = card(grid, 'Jeden trial', null, { wide: true });
  const tl = c.append('div').attr('class', 'timeline');
  tl.append('div').html('<b>1. Słuchanie fragmentu</b><small>~45 s, audio TTS, wzrok na krzyżu fiksacyjnym. Tu rejestrowane są źrenica, mrugnięcia i sakady.</small>');
  tl.append('div').html('<b>2. Sonda MW</b><small>„W jakim stopniu byłeś rozproszony?” suwak 0–99.</small>');
  tl.append('div').html('<b>3. Relacja myśli</b><small>Ustnie, max 25 s: „Opisz przebieg swoich myśli od ostatniej przerwy”. Transkrypcja Whisperem, lematyzacja Morfeuszem.</small>');
  c.append('div').attr('class', 'muted').text('Kolejność 40 fragmentów (K = Karolina, J = Janek):');
  const seq = c.append('div').attr('class', 'seq');
  D.fragments.forEach(f => seq.append('i').attr('class', 'hero-' + f.hero[0]).text(f.hero[0]).attr('title', `${f.trial}. ${f.fragment}`));
  const two = c.append('div').attr('class', 'two').style('margin-top', '10px');
  two.append('div').html(`<b style="color:${css('--s1')}">Exp1 · wskazany bohater</b> (${D.meta.exp.Exp1_Cued.subjects} osób)<br><span class="muted">Przed bajką: „Skup się i zapamiętaj wszystko o bohaterze o imieniu X”. Fragmenty X są <b>TRACKED</b>, drugiego bohatera <b>UNTRACKED</b>. Pytanie: czy ludzie strategicznie „odpływają” w fragmentach, które nie są im potrzebne?</span>`);
  two.append('div').html(`<b style="color:${css('--s2')}">Exp2 · ocena ciekawości</b> (${D.meta.exp.Exp2_Preference.subjects} osób, ${D.meta.exp.Exp2_Preference.subjects_with_recalls} z relacjami)<br><span class="muted">Bez instrukcji; po każdym fragmencie dodatkowo ocena „jak ciekawy był ten fragment” (0–100). Pytanie: czy nudniejsze fragmenty = więcej mind wanderingu?</span>`);
  c.append('div').attr('class', 'warn').html('Bajka ma dwoje rodzeństwa o różnej moralności: Janek uczciwy cieśla, Karolina sprytna i interesowna. Tekst wygenerowany przez GPT-4o i czytany syntezatorem mowy. Fragmenty obu bohaterów są wyrównane pod względem długości i czytelności.');
}

// ===== 2. MW over trials
{
  const grid = section('mw', '2 · Mind wandering w czasie', 'Średnia odpowiedź na sondę (0–99) po każdym z 40 fragmentów, osobno dla obu eksperymentów. Pasmo = ±1 SEM.',
    'MW rośnie w trakcie sesji w obu grupach, a grupa bez instrukcji (Exp2) odpływa wyraźnie więcej niż grupa z zadaniem (Exp1). Poza fragmentem 8 (najniżej oceniony jako ciekawy i szczyt MW w Exp2) przebiegi nie dzielą wspólnych szczytów, więc to nie konkretne fragmenty „usypiają”, tylko czas i brak celu.');
  const c = card(grid, 'Przebieg MW przez 40 fragmentów', 'Exp2 zaczyna wyżej i rośnie bardziej. Pod osią: bohater fragmentu.', { wide: true });
  legend(c, [{ t: EXP.Exp1_Cued.name, c: '--s1', line: true }, { t: EXP.Exp2_Preference.name, c: '--s2', line: true }, { t: 'Karolina', c: '--karolina' }, { t: 'Janek', c: '--janek' }]);
  const W = 1160, H = 330, m = { l: 48, t: 10, r: 16, b: 58 };
  const { g, w, h } = frame(c.node(), W, H, m);
  const x = d3.scaleLinear().domain([1, 40]).range([0, w]);
  const y = d3.scaleLinear().domain([0, 60]).range([h, 0]);
  yGrid(g, y, w, 6); xAxis(g, x, h, d3.range(1, 41, 3)); axisTitle(g, 'numer fragmentu (trial)', w, h, 'x'); axisTitle(g, 'MW (0–99)', w, h, 'y');
  D.fragments.forEach(f => g.append('rect').attr('x', x(f.trial) - 6).attr('y', h + 42).attr('width', 12).attr('height', 5).attr('rx', 1.5).attr('fill', css(heroC(f.hero))));
  const rows = [];
  for (const e of ['Exp1_Cued', 'Exp2_Preference']) {
    const cv = D.curves[e], col = css(EXP[e].c);
    const pts = cv.mean.map((v, i) => ({ t: i + 1, v, s: cv.sem[i] }));
    g.append('path').datum(pts).attr('fill', col).attr('opacity', .14).attr('d', d3.area().x(d => x(d.t)).y0(d => y(d.v - d.s)).y1(d => y(d.v + d.s)).curve(d3.curveMonotoneX));
    g.append('path').datum(pts).attr('fill', 'none').attr('stroke', col).attr('stroke-width', 2).attr('d', d3.line().x(d => x(d.t)).y(d => y(d.v)).curve(d3.curveMonotoneX));
    g.append('text').attr('class', 'lbl').attr('x', x(40) + 4).attr('y', y(pts[39].v) + 4).attr('fill', col).text(e === 'Exp1_Cued' ? 'Exp1' : 'Exp2');
    pts.forEach(p => rows.push({ exp: e, trial: p.t, mw: p.v, sem: p.s }));
  }
  // crosshair
  const cross = g.append('line').attr('class', 'axis-line').attr('y1', 0).attr('y2', h).style('display', 'none');
  const dots = g.append('g');
  g.append('rect').attr('width', w).attr('height', h).attr('fill', 'transparent')
    .on('mousemove', ev => { const t = Math.round(x.invert(d3.pointer(ev)[0])); if (t < 1 || t > 40) return; cross.style('display', null).attr('x1', x(t)).attr('x2', x(t));
      const f = D.fragments[t - 1];
      dots.selectAll('circle').data(['Exp1_Cued', 'Exp2_Preference']).join('circle').attr('r', 4.5).attr('cx', x(t)).attr('cy', e => y(D.curves[e].mean[t - 1])).attr('fill', e => css(EXP[e].c)).attr('stroke', css('--surface')).attr('stroke-width', 2);

{

function pairedDots(c, pairs, labels, cols, ylab) {
  legend(c, [{ t: labels[0], c: cols[0] }, { t: labels[1], c: cols[1] }]);
  const f = frame(c.node(), 560, 240, { l: 44, t: 8, r: 8, b: 30 });
  const sorted = pairs.slice().sort((p, q) => (p.a + p.b) - (q.a + q.b));
  const x = d3.scalePoint().domain(sorted.map(p => p.id)).range([0, f.w]).padding(0.5);
  const y = d3.scaleLinear().domain([0, 100]).range([f.h, 0]);
  yGrid(f.g, y, f.w, 5); f.g.append('line').attr('class', 'axis-line').attr('x1', 0).attr('x2', f.w).attr('y1', f.h).attr('y2', f.h);
  axisTitle(f.g, 'osoby, posortowane', f.w, f.h, 'x'); axisTitle(f.g, ylab, f.w, f.h, 'y');
  const g = f.g.append('g').selectAll('g').data(sorted).join('g');
  g.append('line').attr('x1', p => x(p.id)).attr('x2', p => x(p.id)).attr('y1', p => y(p.a)).attr('y2', p => y(p.b)).attr('stroke', css('--axis'));
  g.append('circle').attr('cx', p => x(p.id)).attr('cy', p => y(p.a)).attr('r', 3.5).attr('fill', css(cols[0]));
  g.append('circle').attr('cx', p => x(p.id)).attr('cy', p => y(p.b)).attr('r', 3.5).attr('fill', css(cols[1]));
  hover(g, p => `<b>${p.id}</b><br>${labels[0]}: ${fmt(p.a)}<br>${labels[1]}: ${fmt(p.b)}`);
}

        const y2 = d3.scaleLinear().domain([d3.min(vals) * 0.97, d3.max(vals) * 1.03]).nice().range([f2.h, 0]);
        yGrid(f2.g, y2, f2.w, 4); xAxis(f2.g, x2, f2.h, d3.range(0, p.length, 5)); axisTitle(f2.g, 'sekunda fragmentu', f2.w, f2.h, 'x');
        f2.g.append('g').selectAll('rect').data(bl).join('rect').attr('x', b => x2(b[0])).attr('y', 0).attr('width', b => Math.max(1.5, x2(b[0] + b[1]) - x2(b[0]))).attr('height', f2.h).attr('fill', css('--s8')).attr('opacity', .35);
        f2.g.append('path').datum(p.map((v, i) => ({ i, v }))).attr('fill', 'none').attr('stroke', css('--s1')).attr('stroke-width', 2).attr('d', d3.line().defined(d => d.v != null).x(d => x2(d.i)).y(d => y2(d.v)));
        const cross = f2.g.append('line').attr('class', 'axis-line').attr('y1', 0).attr('y2', f2.h).style('display', 'none');
        f2.g.append('rect').attr('width', f2.w).attr('height', f2.h).attr('fill', 'transparent').on('mousemove', ev => { const i = Math.round(x2.invert(d3.pointer(ev)[0])); if (i < 0 || i >= p.length) return; cross.style('display', null).attr('x1', x2(i)).attr('x2', x2(i)); showTip(`<b>sekunda ${i}</b><br>źrenica ${p[i] ?? 'brak'}`, ev); }).on('mouseleave', () => { cross.style('display', 'none'); hideTip(); });
      }
    }
    const fr = D.fragments[t - 1];
    story.html(`<h3>${fr.trial}. ${fr.fragment} <span class="pill">${fr.hero}</span></h3><div class="story">${fr.story}</div>`);
    const r = D.recalls.find(x => x.s === sid && x.t === t);
    rec.html(`<h3>Relacja · MW ${s.mw[t - 1]}${r && r.tr ? ' · ' + (r.tr === 'T' ? 'TRACKED' : 'UNTRACKED') : ''}${r && r.pref != null ? ' · ciekawość ' + r.pref : ''}</h3>` + (r ? `<div class="story">${r.u}</div><div class="muted" style="margin-top:4px">${r.w} słów · sprzężenie z historią ${fmt(r.c, 2)} · odniesienia do siebie ${fmt(r.sr, 2)}${r.nt ? ' · tylko o uwadze' : ''}${r.ai ? ' · deklaracja uwagi' : ''}</div>` : '<div class="muted">brak relacji dla tego trialu</div>'));
  }
  ['vSub', 'vTrial'].forEach(id => document.getElementById(id).addEventListener('change', render));
  subSel.property('value', 'ADNA2507'); render();
}

// ===== toc + theme
d3.select('#toc').selectAll('a').data(sections).join('a').attr('href', s => '#' + s.id).text(s => s.title);
document.getElementById('themeBtn').addEventListener('click', () => {
  const r = document.documentElement, cur = r.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (e) {}
  location.reload();   // colors are read into SVG attributes at build time, so a theme change re-renders the page
});
</script>
